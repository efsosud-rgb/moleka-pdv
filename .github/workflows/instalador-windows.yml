# Gera o instalador do Moleka PDV para Windows, testa e publica.
#
# - Em "git push" no ramo main: se a versão escrita em app/config.py (VERSAO) ainda não foi
#   publicada, testa, gera o instalador e publica em Releases como v<VERSAO>. Se já foi, não
#   faz nada. Ou seja: para sair uma versão nova, basta aumentar VERSAO e enviar para o main.
# - Em "git push" num ramo build/**: faz tudo igual, mas não publica (para testar o empacotamento).
#
# Por que no GitHub: o instalador do Windows só pode ser gerado num Windows.

name: Instalador Windows

on:
  push:
    branches: [main, 'build/**']
    paths:
      - 'app/**'
      - 'ui/**'
      - 'assets/brand/**'
      - 'packaging/**'
      - 'main.py'
      - 'pyproject.toml'
      - '.github/workflows/instalador-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Decide o que fazer
        id: plano
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $codigo = (Select-String -Path app/config.py -Pattern '^VERSAO = "(.+)"').Matches[0].Groups[1].Value
          $construir = 'sim'; $publicar = 'nao'; $versao = "$codigo-dev.$env:GITHUB_RUN_NUMBER"
          if ($env:GITHUB_REF -eq 'refs/heads/main') {
            gh release view "v$codigo" *> $null
            if ($LASTEXITCODE -eq 0) {
              $construir = 'nao'
              Write-Host "A versão v$codigo já está publicada: nada a fazer. Para publicar outra, aumente VERSAO em app/config.py."
            } else {
              $publicar = 'sim'; $versao = $codigo
            }
          }
          "versao=$versao" >> $env:GITHUB_OUTPUT
          "construir=$construir" >> $env:GITHUB_OUTPUT
          "publicar=$publicar" >> $env:GITHUB_OUTPUT
          Write-Host "Versão: $versao | construir: $construir | publicar: $publicar"
          $global:LASTEXITCODE = 0

      - uses: actions/setup-python@v5
        if: steps.plano.outputs.construir == 'sim'
        with:
          python-version: '3.12'
          cache: pip

      - name: Instala as dependências
        if: steps.plano.outputs.construir == 'sim'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      - name: Roda os testes
        if: steps.plano.outputs.construir == 'sim'
        run: python -m pytest -q

      - name: Empacota o programa (PyInstaller)
        if: steps.plano.outputs.construir == 'sim'
        run: pyinstaller packaging/moleka.spec --noconfirm

      - name: Testa o programa empacotado
        if: steps.plano.outputs.construir == 'sim'
        shell: pwsh
        run: ./packaging/teste_windows.ps1

      - name: Baixa o instalador do WebView2 (Microsoft)
        if: steps.plano.outputs.construir == 'sim'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile build/MicrosoftEdgeWebview2Setup.exe
          $assinatura = Get-AuthenticodeSignature build/MicrosoftEdgeWebview2Setup.exe
          if ($assinatura.Status -ne 'Valid' -or $assinatura.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
            throw "O instalador do WebView2 baixado não está assinado pela Microsoft ($($assinatura.Status))."
          }

      - name: Gera o instalador (Inno Setup)
        if: steps.plano.outputs.construir == 'sim'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.plano.outputs.versao }}" packaging\moleka.iss
          if ($LASTEXITCODE -ne 0) { throw "O Inno Setup falhou (código $LASTEXITCODE)." }
          Get-ChildItem dist\MolekaPDV-Instalador-*.exe | ForEach-Object { Write-Host "$($_.Name): $([math]::Round($_.Length / 1MB, 1)) MB" }

      - name: Testa o instalador
        if: steps.plano.outputs.construir == 'sim'
        shell: pwsh
        run: ./packaging/teste_windows.ps1 -Instalador (Get-ChildItem dist\MolekaPDV-Instalador-*.exe).FullName

      - name: Guarda o instalador e os prints do teste
        if: always() && steps.plano.outputs.construir == 'sim'
        uses: actions/upload-artifact@v4
        with:
          name: moleka-pdv-${{ steps.plano.outputs.versao }}
          path: |
            dist/MolekaPDV-Instalador-*.exe
            dist/teste/**
          if-no-files-found: warn

      - name: Publica a versão
        if: steps.plano.outputs.publicar == 'sim'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Vão juntos o instalador e os prints da janela tirados no teste (prova de que abriu).
          $arquivos = @((Get-ChildItem dist\MolekaPDV-Instalador-*.exe).FullName)
          $arquivos += @(Get-ChildItem dist\teste\janela-*.png | ForEach-Object { $_.FullName })
          gh release create "v${{ steps.plano.outputs.versao }}" $arquivos --target $env:GITHUB_SHA --title "Moleka PDV ${{ steps.plano.outputs.versao }}" --notes-file packaging/notas-da-versao.md --prerelease
