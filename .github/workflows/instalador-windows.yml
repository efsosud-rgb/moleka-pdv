# Gera o instalador do Moleka PDV para Windows, testa e publica.
#
# - Em "git push" de uma tag v*  (ex.: v0.1.0): testa, gera o instalador e publica na página
#   de versões (Releases) do repositório.
# - Em "git push" num ramo build/**: faz tudo igual, mas não publica (serve para testar o empacotamento).
#
# Por que no GitHub: o instalador do Windows só pode ser gerado num Windows.

name: Instalador Windows

on:
  push:
    tags: ['v*']
    branches: ['build/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instala as dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      - name: Roda os testes
        run: python -m pytest -q

      - name: Define a versão
        id: versao
        shell: pwsh
        run: |
          $codigo = python -c "from app import config; print(config.VERSAO)"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tag -ne $codigo) { throw "A tag ($tag) não bate com a versão do código ($codigo). Atualize app/config.py." }
            $versao = $codigo
          } else {
            $versao = "$codigo-dev.$env:GITHUB_RUN_NUMBER"
          }
          "versao=$versao" >> $env:GITHUB_OUTPUT
          Write-Host "Versão: $versao"

      - name: Empacota o programa (PyInstaller)
        run: pyinstaller packaging/moleka.spec --noconfirm

      - name: Testa o programa empacotado
        shell: pwsh
        run: ./packaging/teste_windows.ps1

      - name: Baixa o instalador do WebView2 (Microsoft)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile build/MicrosoftEdgeWebview2Setup.exe
          $assinatura = Get-AuthenticodeSignature build/MicrosoftEdgeWebview2Setup.exe
          if ($assinatura.Status -ne 'Valid' -or $assinatura.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
            throw "O instalador do WebView2 baixado não está assinado pela Microsoft ($($assinatura.Status))."
          }

      - name: Gera o instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.versao.outputs.versao }}" packaging\moleka.iss
          if ($LASTEXITCODE -ne 0) { throw "O Inno Setup falhou (código $LASTEXITCODE)." }
          Get-ChildItem dist\MolekaPDV-Instalador-*.exe | ForEach-Object { Write-Host "$($_.Name): $([math]::Round($_.Length / 1MB, 1)) MB" }

      - name: Testa o instalador
        shell: pwsh
        run: ./packaging/teste_windows.ps1 -Instalador (Get-ChildItem dist\MolekaPDV-Instalador-*.exe).FullName

      - name: Guarda o instalador e os prints do teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moleka-pdv-${{ steps.versao.outputs.versao }}
          path: |
            dist/MolekaPDV-Instalador-*.exe
            dist/teste/**
          if-no-files-found: warn

      - name: Publica a versão
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $instalador = (Get-ChildItem dist\MolekaPDV-Instalador-*.exe).FullName
          gh release create $env:GITHUB_REF_NAME $instalador --title "Moleka PDV ${{ steps.versao.outputs.versao }}" --notes-file packaging/notas-da-versao.md --prerelease
