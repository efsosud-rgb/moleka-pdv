[project]
name = "moleka-pdv"
version = "0.6.0"
description = "Frente de loja da sorveteria Moleka: caixa, NFC-e, estoque e financeiro"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pywebview>=5.3",
    "jinja2>=3.1",
    "tzdata>=2024.1",  # o Windows não traz a base de fusos horários (America/Sao_Paulo)
    "openpyxl>=3.1",  # planilhas do Excel dos relatórios (ver docs/DECISOES.md, 12/11/2026)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.10", "types-openpyxl"]
build = ["pyinstaller>=6.10"]

[project.scripts]
moleka-pdv = "main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.api", "app.fiscal"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends(...) como default é o padrão do FastAPI

[tool.ruff.lint.per-file-ignores]
"tools/design/exporta_prototipo.py" = ["E501"]  # CSS e JS embutidos em linhas longas

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "app/dinheiro.py",
    "app/precos.py",
    "app/fiscal",
    "app/seguranca.py",
    "app/acesso.py",
    "app/operadores.py",
    "app/api/login.py",
    "app/tempo.py",
    "app/pesquisa.py",
    "app/documentos.py",
    "app/caixa.py",
    "app/vendas.py",
    "app/api/caixa.py",
    "app/api/vendas.py",
    "app/api/cadastros.py",
    "app/catalogo.py",
    "app/estoque.py",
    "app/nfe_xml.py",
    "app/compras.py",
    "app/financeiro.py",
    "app/api/estoque.py",
    "app/api/compras.py",
    "app/api/financeiro.py",
    "app/configuracoes.py",
    "app/cupom.py",
    "app/escpos.py",
    "app/impressoras.py",
    "app/impressao.py",
    "app/backup.py",
    "app/api/configuracoes.py",
    "app/api/impressao.py",
    "app/relatorios.py",
    "app/api/relatorios.py",
    "app/excel.py",
    "app/api/planilhas.py",
    "app/salvar.py",
]
