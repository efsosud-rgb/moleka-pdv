<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Moleka PDV — Capa e login</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Nunito:wght@700;800;900&amp;display=swap">
<style>
/* Cores da logomarca: vermelho #E43030 (letras), amarelo #FCF00C (oval), vinho #542424 (contorno), verde #249C48 (macacão). */
*{box-sizing:border-box}
body{margin:0;background:#D42828;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#2A1A18;font-size:14px}
a{color:#9E1A20}a:hover{color:#542424}
button,input,select{font:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:Nunito,Inter,sans-serif}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* capa: artes novas na vitrine (logo 3D e loja se alternando), animação da mascote no telão e login */
.capa{flex:1;display:flex;flex-wrap:wrap;align-items:stretch;background:linear-gradient(#EA3939,#D42828)}
.vitrine{flex:999 1 560px;min-width:0;min-height:420px;display:flex;justify-content:center;padding:18px 0 22px 18px;perspective:1400px;container-type:size}
.arte{position:relative;flex:1;max-width:calc((100cqh - 12px) * 1.7768 + 12px);overflow:hidden;border:6px solid #FCF00C;border-radius:22px;background:#3B1818;box-shadow:0 0 0 2px #542424,0 6px 0 2px #7E1A1E,0 24px 34px rgba(40,0,0,.5);transition:transform .3s ease-out}
.quadro{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden}
.cobre{position:absolute;left:36.6%;top:50%;height:100%;aspect-ratio:1672/941;transform:translate(-36.6%,-50%)}
.cobre img{display:block;width:100%;height:100%;object-fit:cover}
.anim .cobre{animation:respira 18s ease-in-out infinite alternate}
@keyframes respira{from{transform:translate(-36.6%,-50%) scale(1)}to{transform:translate(-36.6%,-50%) scale(1.03)}}
.q2 img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 72%}
.q2{opacity:0}
.anim .q2{animation:troca 26s ease-in-out infinite}
@keyframes troca{0%,46%{opacity:0}52%,94%{opacity:1}100%{opacity:0}}

/* brilho que passa sobre a logo 3D e beijos que saem da mascote em direção ao nome */
.brilho{position:absolute;left:10.2%;top:11%;width:48.8%;height:42.5%;border-radius:50%;overflow:hidden;pointer-events:none}
.brilho::before{content:"";position:absolute;top:-30%;bottom:-30%;left:-45%;width:24%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.65),rgba(255,255,255,0));transform:skewX(-18deg)}
.anim .brilho::before{animation:brilho 6.5s ease-in-out infinite}
@keyframes brilho{0%,55%{left:-45%}80%,100%{left:125%}}
.beijo{position:absolute;left:70.3%;top:25.3%;width:34px;height:34px;color:#FF4D6D;opacity:0;pointer-events:none}
.beijo svg{display:block;width:100%;height:100%;filter:drop-shadow(0 2px 0 #FFFFFF) drop-shadow(0 4px 6px rgba(60,0,0,.4))}
.anim .beijo{animation:beijo 6.5s ease-out infinite}
.anim .beijo.b2{animation-delay:.35s}
.anim .beijo.b3{animation-delay:.7s}
@keyframes beijo{0%,50%{opacity:0;transform:translate(0,0) scale(.3)}56%{opacity:1}84%{opacity:.95;transform:translate(-150px,-58px) scale(1.15)}100%{opacity:0;transform:translate(-190px,-96px) scale(.9)}}

/* painel da direita: a parede vermelha, com o telão e o login */
.painel{flex:1 1 360px;max-width:380px;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:16px 20px}
.telao{padding:6px;border:2px solid #9E1A20;border-radius:16px;background:linear-gradient(#FFF98F,#FCF00C 55%,#F2DA0A);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 5px 0 #7E1A1E,0 14px 22px rgba(60,0,0,.4)}
.filme{width:100%;aspect-ratio:507/336;border:2px solid #542424;border-radius:10px;background:#542424 url(../../assets/brand/capa_animacao_tira.jpg) 100% 0/900% 100% no-repeat}
.anim .filme{animation:filme 9s steps(9) infinite}
@keyframes filme{from{background-position:0 0}to{background-position:112.5% 0}}
@media (prefers-reduced-motion:reduce){.anim .cobre,.anim .q2,.anim .brilho::before,.anim .beijo,.anim .filme{animation:none}}

/* botões com relevo */
.btn3d{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:Nunito,Inter,sans-serif;font-weight:900;font-size:15px;line-height:1.1;padding:12px 18px;min-height:46px;border:1px solid #CDB77A;border-radius:12px;cursor:pointer;color:#542424;background:linear-gradient(#FFFFFF,#FFF8E6 60%,#F5E7C2);box-shadow:inset 0 1px 0 #FFFFFF,0 4px 0 #CDB77A,0 8px 14px rgba(110,70,0,.18);transition:transform .08s ease,box-shadow .08s ease,filter .15s ease;text-decoration:none;white-space:nowrap}
.btn3d:hover{filter:brightness(1.03);color:#542424}
.btn3d:active{transform:translateY(4px);box-shadow:inset 0 1px 0 #FFFFFF,0 0 0 #CDB77A,0 2px 4px rgba(110,70,0,.25)}
.btn3d:focus-visible{outline:3px solid #1F6FD1;outline-offset:2px}
.btn3d.amarelo{color:#9E1A20;border:2px solid #E43030;background:linear-gradient(#FFF98F,#FCF00C 55%,#F2DA0A);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 4px 0 #C9A400,0 8px 14px rgba(120,80,0,.28)}
.btn3d.amarelo:hover{color:#9E1A20}
.btn3d.amarelo:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 0 0 #C9A400,0 2px 4px rgba(120,80,0,.3)}
.btn3d.lg{font-size:17px;min-height:52px}
.btn3d.bloco{display:flex;width:100%}

/* campos com profundidade */
.rotulo{display:block;font-weight:800;font-size:11.5px;color:#5A4237;letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px}
.campo{display:block;width:100%;font-size:15px;color:#2A1A18;background:#FFFFFF;border:1px solid #CDB77A;border-radius:10px;padding:11px 13px;min-height:46px;box-shadow:inset 0 3px 6px rgba(110,70,0,.13),inset 0 1px 2px rgba(110,70,0,.18),0 1px 0 #FFFFFF}
.campo::placeholder{color:#76604F}
.campo:focus{outline:none;border-color:#E43030;box-shadow:inset 0 3px 6px rgba(110,70,0,.13),0 0 0 2px #E43030,0 0 0 6px rgba(252,240,12,.8)}
.com-icone{position:relative}
.com-icone .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#9E1A20;pointer-events:none}
.com-icone .campo{padding-left:46px}
.sel select{appearance:none;padding-right:40px}
.sel .seta{left:auto;right:12px}

.cartao{background:#FFFFFF;border:1px solid #EADBA8;border-radius:16px;box-shadow:inset 0 1px 0 #FFFFFF,0 5px 0 #7E1A1E,0 16px 26px rgba(60,0,0,.4)}
.login{display:flex;flex-direction:column;gap:13px;padding:18px 20px 16px}
.login h2{font-weight:900;font-size:23px;color:#542424}
.login .data{margin-top:-9px;font-size:13px;color:#5A4237}
.login .ajuda{font-size:12.5px;line-height:1.45;color:#5A4237}

/* barra de status */
.rodape{display:flex;align-items:center;flex-wrap:wrap;gap:6px 18px;padding:6px 14px;background:#542424;color:#FFE8B0;font-size:12.5px}
.rodape .dir{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.status{display:inline-flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;background:#B5A396;box-shadow:inset 0 -1px 0 rgba(0,0,0,.25)}
.tecla{display:inline-flex;align-items:center;gap:6px}
kbd{font:800 11.5px Inter,system-ui,sans-serif;color:#542424;background:linear-gradient(#FFF98F,#FCF00C);border:1px solid #C9A400;border-radius:5px;padding:3px 6px;box-shadow:0 2px 0 #9C7F00}
@media (max-width:920px){.painel{max-width:none}}

.proto-nav{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:99;display:flex;flex-direction:column;gap:4px;align-items:center;padding:6px 3px;border-radius:12px 0 0 12px;background:rgba(59,24,24,.92);box-shadow:0 6px 18px rgba(0,0,0,.35);font:800 11px/1 Inter,system-ui,sans-serif}
.proto-nav a{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#6E2E2E;color:#FCF00C;text-decoration:none}
.proto-nav a:hover,.proto-nav a.atual{background:#FCF00C;color:#542424}
</style>
</head>
<body>
<div class="anim" style="min-height:100vh;display:flex;flex-direction:column;background:#D42828">
<div class="capa">
<div class="vitrine">
<div class="arte" style="transform:rotateX(0deg) rotateY(0deg)">
<div class="quadro q1">
<div class="cobre">
<img src="../../assets/brand/capa_logo_3d.jpg" alt="Logo Moleka Sorvetes em 3D, com a mascote apontando para o nome e sorvetes no balcão">
<div class="brilho"></div>
<span class="beijo b1"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.6 1.3 4.3 2.6.7-1.3 2.1-2.6 4.3-2.6 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg></span>
<span class="beijo b2"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.6 1.3 4.3 2.6.7-1.3 2.1-2.6 4.3-2.6 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg></span>
<span class="beijo b3"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.6 1.3 4.3 2.6.7-1.3 2.1-2.6 4.3-2.6 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg></span>
</div>
</div>
<div class="quadro q2"><img src="../../assets/brand/capa_loja.jpg" alt="Interior da loja Moleka Sorvetes"></div>
</div>
</div>
<aside class="painel">
<div class="telao"><div class="filme" role="img" aria-label="Animação: a mascote corre pela loja, mostra o picolé Moleka e convida a comprar" style="animation-duration:9s"></div></div>
<section class="cartao login" aria-labelledby="t-login">
<h2 id="t-login">Entrar no sistema</h2>
<p class="data"><span data-auto="hoje"></span></p>
<div>
<label class="rotulo" for="operador">Operador</label>
<div class="com-icone sel">
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.4 4-6.5 8-6.5s7.2 2.1 8 6.5"/></svg>
<select id="operador" name="operador" class="campo"><option>Selecione o operador…</option></select>
<svg class="ic seta" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
</div>
</div>
<div>
<label class="rotulo" for="senha">Senha</label>
<div class="com-icone">
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
<input id="senha" name="senha" class="campo" type="password" placeholder="Digite sua senha">
</div>
</div>
<a class="btn3d amarelo lg bloco" href="inicio.html">Entrar (Enter)</a>
<p class="ajuda">Esqueceu a senha? O administrador redefine em Configurações › Operadores.</p>
</section>
</aside>
</div>
<footer class="rodape">
<span>Moleka PDV · versão 0.1 (prévia)</span>
<span class="status"><span class="dot"></span>Banco local: —</span>
<span class="status"><span class="dot"></span>SEFAZ: —</span>
<span class="dir">
<span class="tecla"><kbd>Enter</kbd>Entrar</span>
<span class="tecla"><kbd>F1</kbd>Ajuda</span>
<span class="tecla"><kbd>Esc</kbd>Sair</span>
</span>
</footer>
</div>

<nav class="proto-nav" aria-label="Telas do protótipo" title="Protótipo — clique para trocar de tela"><a href="index.html" class="atual" title="1 · Abertura / Login">1</a><a href="inicio.html" class="" title="2 · Início">2</a><a href="caixa.html" class="" title="3 · Caixa (PDV)">3</a><a href="financeiro.html" class="" title="4 · Financeiro / DRE">4</a><a href="produtos.html" class="" title="5 · Produtos">5</a></nav>
<script>
(function () {
  var d = new Date();
  var auto = {
    hoje: d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' }),
    mesAno: d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })
  };
  document.querySelectorAll('[data-auto]').forEach(function (el) { el.textContent = auto[el.getAttribute('data-auto')] || ''; });
})();

(function () {
  // A arte da vitrine se inclina de leve acompanhando o mouse.
  var vitrine = document.querySelector('.vitrine'), arte = document.querySelector('.arte');
  if (vitrine && arte) {
    vitrine.addEventListener('mousemove', function (e) {
      var r = vitrine.getBoundingClientRect();
      var x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
      arte.style.transform = 'rotateX(' + (-y * 4).toFixed(1) + 'deg) rotateY(' + (x * 5).toFixed(1) + 'deg)';
    });
    vitrine.addEventListener('mouseleave', function () { arte.style.transform = 'rotateX(0deg) rotateY(0deg)'; });
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter') location.href = 'inicio.html'; });
})();
</script>
</body>
</html>
