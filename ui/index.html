<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moleka PDV — Abertura</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap">
<link rel="stylesheet" href="/css/moleka.css">
<script src="/js/moleka.js" defer></script>
</head>
<body class="anim">
<div class="abertura">
  <section class="palco">
    <div class="bola a" style="left:-120px;top:-140px;width:420px;height:420px" aria-hidden="true"></div>
    <div class="bola b" style="right:-160px;bottom:-200px;width:520px;height:520px" aria-hidden="true"></div>
    <div class="cena">
      <div class="chao" aria-hidden="true"></div>
      <div class="logo lg">
        <div class="oval-wrap"><img class="oval3d" src="/assets/brand/logo_oval.png" alt="Moleka Sorvetes"></div>
        <div class="mascote-wrap">
          <div class="lean"><img class="mascote" src="/assets/brand/mascote.png" alt="Mascote da Moleka apontando para o nome da marca"></div>
          <svg class="heart h1" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.6-9.5-9A5.3 5.3 0 0 1 12 6.4a5.3 5.3 0 0 1 9.5 5.6C19 16.4 12 21 12 21z" fill="#E43238" stroke="#51222B" stroke-width="1.2"/></svg>
          <svg class="heart h2" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.6-9.5-9A5.3 5.3 0 0 1 12 6.4a5.3 5.3 0 0 1 9.5 5.6C19 16.4 12 21 12 21z" fill="#FF6B70" stroke="#51222B" stroke-width="1.2"/></svg>
          <svg class="heart h3" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.6-9.5-9A5.3 5.3 0 0 1 12 6.4a5.3 5.3 0 0 1 9.5 5.6C19 16.4 12 21 12 21z" fill="#E43238" stroke="#51222B" stroke-width="1.2"/></svg>
        </div>
      </div>
    </div>
    <div class="marca">
      <div class="nome">Frente de Loja</div>
      <div class="sub">Caixa · Estoque · Financeiro · NFC-e</div>
    </div>
  </section>
  <section class="painel">
    <form class="card3d xl login" id="form-login" action="/inicio.html" method="get">
      <div class="col" style="gap:4px">
        <h1>Bem-vindo(a)!</h1>
        <div style="font-size:14px;color:var(--tinta-3)">Identifique-se para abrir o caixa.</div>
      </div>
      <div class="campo">
        <label class="label" for="operador">Operador</label>
        <input class="field3d" id="operador" name="operador" type="text" placeholder="Nome ou código do operador" autocomplete="username" autofocus>
      </div>
      <div class="campo">
        <label class="label" for="senha">Senha</label>
        <input class="field3d" id="senha" name="senha" type="password" placeholder="••••••" autocomplete="current-password">
      </div>
      <div class="campo">
        <label class="label" for="caixa">Caixa</label>
        <select class="field3d" id="caixa" name="caixa">
          <option>Caixa 01</option>
        </select>
      </div>
      <label class="check"><input type="checkbox" name="lembrar"> Lembrar operador neste computador</label>
      <div class="col" style="gap:12px;margin-top:6px">
        <button class="btn3d green lg" type="submit">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M21 3v18"/></svg>
          Entrar
        </button>
        <button class="btn3d" type="button" disabled title="disponível depois do módulo Controle de Caixa">Abrir caixa com fundo de troco</button>
      </div>
      <div class="linha" style="gap:8px;justify-content:center;margin-top:8px">
        <span class="chip neutro" data-status="fiscal" data-rotulo="SEFAZ"><span class="dot" aria-hidden="true"></span><span class="texto">SEFAZ: —</span></span>
        <span class="chip neutro" data-status="certificado" data-rotulo="Certificado A1"><span class="dot" aria-hidden="true"></span><span class="texto">Certificado A1: —</span></span>
        <span class="chip neutro" data-status="impressora_cupom" data-rotulo="Impressora"><span class="dot" aria-hidden="true"></span><span class="texto">Impressora: —</span></span>
      </div>
      <div class="nota" style="text-align:center"><span data-versao>—</span> · Enter = Entrar · Esc = Sair</div>
    </form>
  </section>
</div>
<script>
  // Autenticação de operador ainda não existe (frente "Operadores e login"); por enquanto o Entrar leva ao Início.
  document.getElementById("form-login").addEventListener("submit", function (e) { e.preventDefault(); location.href = "/inicio.html"; });
</script>
</body>
</html>
